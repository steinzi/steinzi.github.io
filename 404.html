<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a1919">
  <title>Page not found — Steinzi</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3f0e8; color: #0a1919; font-family: Manrope, system-ui, -apple-system, sans-serif; }
    main { max-width: 36rem; padding: 2rem 1.25rem; }
    .eyebrow { font-family: "DM Mono", ui-monospace, monospace; font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; margin: 0; }
    h1 { font-size: clamp(2.2rem, 7vw, 4rem); line-height: 1; letter-spacing: -.02em; margin: .6rem 0 1rem; }
    em { font-style: normal; background: #d8ff54; padding: 0 .15em; }
    p { font-size: 1.1rem; line-height: 1.5; margin: 0; }
    a { display: inline-block; margin-top: 1.75rem; padding: .85rem 1.3rem; background: #0a1919; color: #d8ff54; text-decoration: none; border-radius: 999px; font-weight: 700; }
    a:hover, a:focus-visible { background: #243837; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">404 · page not found</p>
    <h1>This page has <em>left the building.</em></h1>
    <p>Whatever lived here moved, retired, or never existed. The working systems are one click away.</p>
    <a href="https://steinzi.com/">Back to steinzi.com</a>
  </main>
  <script>
    // ponytail: the site is one page of anchors; forward the three legacy routes, leave everything else here
    var legacy = { '/about': '#about', '/publications': '#record', '/appearances': '#record' };
    var hash = legacy[location.pathname.toLowerCase().replace(/\/+$/, '')];
    if (hash) location.replace('/' + hash);
  </script>
</body>
</html>
